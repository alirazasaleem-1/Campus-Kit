{% extends "base.html" %}
{% block title %}PDF Merger | CampusKit{% endblock %}
{% block content %}
<section class="form-section">
    <div class="form-header">
        <span class="badge">Free Tool</span>
        <h1>PDF Merger</h1>
        <p>Upload multiple PDFs and combine them into one file.</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="premium-form">
        <label>Select PDF Files</label>
        <div class="dropzone" id="dropzone">
            <div class="dropzone-icon">📁</div>
            <p class="dropzone-text">Drag & drop PDF files here</p>
            <p class="dropzone-hint">or click to browse files</p>
            <input type="file" name="pdf_files" id="fileInput" accept="application/pdf" multiple required>
        </div>
        <ul class="file-list" id="fileList"></ul>

        <button type="submit" class="submit-btn">Merge PDFs</button>
    </form>
</section>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
        fileInput.files = e.dataTransfer.files;
        updateFileList();
    });
    fileInput.addEventListener('change', updateFileList);

    function updateFileList() {
        fileList.innerHTML = '';
        Array.from(fileInput.files).forEach((f, i) => {
            const li = document.createElement('li');
            const size = (f.size / 1024 / 1024).toFixed(2);
            li.innerHTML = '<span class="file-name">' + f.name + '</span><span class="file-size">' + size + ' MB</span>';
            fileList.appendChild(li);
        });
    }
});
</script>
{% endblock %}
